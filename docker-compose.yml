services:
  api:
    build: .
    command: uvicorn mock_api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
  ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DB_PATH: /data/runs.db
    volumes: ["runs:/data"]
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  runs:
